# Logging sisi klien Hadoop.
#
# Tanpa berkas ini setiap perintah mencetak "WARNING: log4j.properties is
# not found. HADOOP_CONF_DIR may be incomplete." dan ikut membanjiri
# keluaran notebook.
#
# Ambangnya WARN supaya keluaran bersih, tetapi kelas Job sengaja
# dinaikkan ke INFO: di situlah baris kemajuan "Running job", "map 100%
# reduce 100%", dan cacah counter dicetak -- justru bagian yang ingin
# dilihat dan dilampirkan ke laporan.

log4j.rootLogger=WARN, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n

log4j.logger.org.apache.hadoop.mapreduce.Job=INFO
log4j.logger.org.apache.hadoop.mapred.ClientServiceDelegate=WARN
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR
